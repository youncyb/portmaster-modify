<div class="flex flex-col w-full h-full gap-3 p-1 overflow-auto">
  <div class="flex flex-row items-center gap-4 text-xxs text-secondary">
    <span class="inline-flex items-center gap-1">
      <span class="inline-block w-2 h-2 rounded-sm bg-cyan-800 bg-opacity-70"></span>
      Received
    </span>
    <span class="inline-flex items-center gap-1">
      <span class="inline-block w-2 h-2 rounded-sm bg-deepPurple-500 bg-opacity-70"></span>
      Sent
    </span>
  </div>

  <div *ngIf="!prepared.length" class="flex items-center justify-center flex-1 text-xs font-light text-tertiary">
    No bandwidth data for this period yet.
  </div>

  <div *ngFor="let row of prepared" class="grid items-center gap-2 app-row">
    <span class="truncate text-xs text-primary" [title]="row.label">{{ row.label }}</span>

    <div class="relative w-full h-4 overflow-hidden rounded bg-gray-300 bg-opacity-40">
      <div class="absolute top-0 bottom-0 left-0 flex flex-row h-full">
        <div class="h-full bg-cyan-800 bg-opacity-70" [style.width.%]="row.incomingPct"></div>
        <div class="h-full bg-deepPurple-500 bg-opacity-70" [style.width.%]="row.outgoingPct"></div>
      </div>
    </div>

    <div class="flex flex-col items-end leading-tight text-xxs text-secondary whitespace-nowrap">
      <span>{{ row.incoming | bytes:'1.0-1' }} ↓</span>
      <span>{{ row.outgoing | bytes:'1.0-1' }} ↑</span>
    </div>
  </div>
</div>
